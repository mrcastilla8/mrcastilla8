      <path d="M654 -19C756 47 738 128 839 153C940 178 1031 126 1240 225" />
      <path d="M620 13C727 73 708 153 813 183C918 213 1019 163 1231 256" />
      <path d="M605 51C692 101 687 183 789 215C891 247 1000 207 1215 292" />
      <path d="M641 96C698 137 695 211 777 246C859 281 981 257 1192 330" />
      <path d="M704 142C741 180 734 241 804 276C874 311 984 298 1167 362" />
      <path d="M743 188C769 222 764 272 824 302C884 332 977 331 1119 382" />
