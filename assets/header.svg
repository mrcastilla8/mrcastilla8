<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Marco Castilla</title>
  <desc id="desc">Portfolio de ingeniería de software, sistemas full-stack e inteligencia artificial aplicada</desc>

  <style>
    .mono { font-family: "Fira Code", "Cascadia Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .label { font-size: 14px; font-weight: 600; letter-spacing: 3px; fill: #e06c75; }
    .nav { font-size: 13px; font-weight: 500; letter-spacing: 1.4px; fill: #6f8f95; }
    .name { font-size: 66px; font-weight: 700; letter-spacing: -3px; fill: #9cdef2; }
    .headline { font-size: 25px; font-weight: 500; fill: #d5e7e7; }
    .muted { font-size: 16px; font-weight: 400; fill: #6f8f95; }
    .status { font-size: 13px; font-weight: 600; letter-spacing: 1px; fill: #9cdef2; }
  </style>

  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#29484d" opacity="0.55" />
    </pattern>
    <radialGradient id="coralGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1050 0) rotate(137) scale(500 370)">
      <stop stop-color="#e06c75" stop-opacity="0.14" />
      <stop offset="1" stop-color="#e06c75" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 20) rotate(30) scale(690 420)">
      <stop stop-color="#355a66" stop-opacity="0.34" />
      <stop offset="1" stop-color="#355a66" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#e06c75" />
      <stop offset="1" stop-color="#9cdef2" />
    </linearGradient>
    <clipPath id="clip">
      <rect width="1200" height="430" rx="20" />
