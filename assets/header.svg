      <text class="mono name" x="0" y="78">Marco Castilla</text>
      <text class="mono headline" x="2" y="128">Convierto problemas reales en</text>
      <text class="mono headline" x="2" y="166" fill="#e06c75">sistemas que funcionan.</text>
      <text class="mono muted" x="2" y="211">Full-stack · Backend · Datos · IA aplicada · Tiempo real</text>
