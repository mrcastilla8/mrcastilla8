<svg width="1200" height="510" viewBox="0 0 1200 510" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Proyectos destacados</title>
  <desc id="desc">Live Whisper Assistant, Marketing CRM y SGPI</desc>

  <style>
    .mono { font-family: "Fira Code", "Cascadia Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 2px; fill: #e06c75; }
    .title { font-size: 25px; font-weight: 700; fill: #9cdef2; }
    .body { font-size: 15px; font-weight: 400; fill: #829fa4; }
    .metric { font-size: 28px; font-weight: 700; fill: #d5e7e7; }
    .chip { font-size: 12px; font-weight: 500; fill: #9cdef2; }
  </style>

  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#29484d" opacity="0.44" />
    </pattern>
    <linearGradient id="cardGlow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1a292b" />
      <stop offset="1" stop-color="#10191b" />
    </linearGradient>
  </defs>

  <rect width="1200" height="510" rx="20" fill="#0f1719" />
  <rect width="1200" height="510" rx="20" fill="url(#dots)" />

  <g transform="translate(48 42)">
    <rect width="348" height="426" rx="14" fill="url(#cardGlow)" stroke="#29484d" />
    <text class="mono eyebrow" x="28" y="39">01 / REAL-TIME SYSTEMS</text>

    <g transform="translate(28 68)">
      <rect width="48" height="48" rx="10" fill="#221e21" stroke="#5d343b" />
      <path d="M10 25H16L20 13L26 36L31 19L36 27H40" stroke="#e06c75" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <text class="mono title" x="28" y="151">Live Whisper</text>
    <text class="mono body" x="28" y="184">Audio por proceso + DSP +</text>
    <text class="mono body" x="28" y="207">transcripción local en GPU.</text>

    <text class="mono metric" x="28" y="267">&lt; 1 segundo</text>
    <text class="mono body" x="28" y="291">de latencia en RTX 3050</text>

    <g transform="translate(28 331)">
      <rect width="82" height="30" rx="6" fill="#182426" stroke="#29484d" />
      <text class="mono chip" x="13" y="20">PYTHON</text>
      <rect x="92" width="68" height="30" rx="6" fill="#182426" stroke="#29484d" />
      <text class="mono chip" x="106" y="20">C++</text>
      <rect x="170" width="84" height="30" rx="6" fill="#182426" stroke="#29484d" />
      <text class="mono chip" x="185" y="20">CUDA</text>
    </g>

    <path d="M28 392H320" stroke="#29484d" />
    <text class="mono eyebrow" x="28" y="414">CAPTURA · PROCESA · TRANSCRIBE</text>
  </g>

  <g transform="translate(426 42)">
    <rect width="348" height="426" rx="14" fill="url(#cardGlow)" stroke="#29484d" />
    <text class="mono eyebrow" x="28" y="39">02 / PRODUCT ENGINEERING</text>

    <g transform="translate(28 68)">
      <rect width="48" height="48" rx="10" fill="#221e21" stroke="#5d343b" />
      <circle cx="15" cy="24" r="4" stroke="#e06c75" stroke-width="2" />
      <circle cx="33" cy="14" r="4" stroke="#e06c75" stroke-width="2" />
      <circle cx="33" cy="34" r="4" stroke="#e06c75" stroke-width="2" />
      <path d="M19 22L29 16M19 26L29 32" stroke="#e06c75" stroke-width="2" />
    </g>

    <text class="mono title" x="28" y="151">Marketing CRM</text>
    <text class="mono body" x="28" y="184">Campañas, leads, métricas,</text>
    <text class="mono body" x="28" y="207">IA y comunicación en vivo.</text>

    <text class="mono metric" x="28" y="267">3 roles RBAC</text>
    <text class="mono body" x="28" y="291">admin · supervisor · agente</text>

    <g transform="translate(28 331)">
      <rect width="78" height="30" rx="6" fill="#182426" stroke="#29484d" />
      <text class="mono chip" x="15" y="20">JAVA</text>
      <rect x="88" width="86" height="30" rx="6" fill="#182426" stroke="#29484d" />
      <text class="mono chip" x="101" y="20">REACT</text>
      <rect x="184" width="106" height="30" rx="6" fill="#182426" stroke="#29484d" />
      <text class="mono chip" x="197" y="20">GEMINI</text>
    </g>

    <path d="M28 392H320" stroke="#29484d" />
    <text class="mono eyebrow" x="28" y="414">DISEÑA · CONECTA · DESPLIEGA</text>
  </g>

  <g transform="translate(804 42)">
    <rect width="348" height="426" rx="14" fill="url(#cardGlow)" stroke="#29484d" />
    <text class="mono eyebrow" x="28" y="39">03 / DATA SYSTEMS</text>

    <g transform="translate(28 68)">
      <rect width="48" height="48" rx="10" fill="#221e21" stroke="#5d343b" />
      <ellipse cx="24" cy="14" rx="13" ry="5" stroke="#e06c75" stroke-width="2" />
      <path d="M11 14V32C11 35 17 38 24 38C31 38 37 35 37 32V14" stroke="#e06c75" stroke-width="2" />
      <path d="M11 23C11 26 17 29 24 29C31 29 37 26 37 23" stroke="#e06c75" stroke-width="2" />
    </g>

    <text class="mono title" x="28" y="151">SGPI</text>
    <text class="mono body" x="28" y="184">Investigación académica con</text>
    <text class="mono body" x="28" y="207">scraping, OCR y auditoría.</text>

    <text class="mono metric" x="28" y="267">4 fuentes ETL</text>
    <text class="mono body" x="28" y="291">reconciliación y trazabilidad</text>

    <g transform="translate(28 331)">
      <rect width="88" height="30" rx="6" fill="#182426" stroke="#29484d" />
      <text class="mono chip" x="14" y="20">FASTAPI</text>
      <rect x="98" width="98" height="30" rx="6" fill="#182426" stroke="#29484d" />
      <text class="mono chip" x="111" y="20">POSTGRES</text>
      <rect x="206" width="66" height="30" rx="6" fill="#182426" stroke="#29484d" />
      <text class="mono chip" x="221" y="20">OCR</text>
    </g>

    <path d="M28 392H320" stroke="#29484d" />
    <text class="mono eyebrow" x="28" y="414">EXTRAE · RECONCILIA · AUDITA</text>
  </g>

  <rect x="1" y="1" width="1198" height="508" rx="19" stroke="#29484d" stroke-width="2" />
</svg>
